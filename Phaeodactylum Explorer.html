<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phaeodactylum Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  /* Same printed technical plate as the leaf, engine and synapse explorers: part index | 3D plate | card, controls under the plate. One light theme. */
  --paper:#e7eae6;
  --panel:#fcfcfb;
  --ink:#1b2320;
  --muted:#5a6560;
  --line:#d3d9d4;
  --accent:#d95b17;
  --accent-soft:#fbe8dc;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-columns:256px minmax(0,1fr) 364px;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"index view card" "index tools card"}

#index{grid-area:index;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:5}
.index-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 12px 6px 16px}
.index-head h2{margin:0;font:600 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#partList{overflow:auto;padding:0 6px 18px;min-height:0;flex:1}
.grp{display:flex;flex-direction:column;gap:1px;margin-top:8px}
.grp h3{margin:0;padding:8px 10px 3px;font:600 12px/1.2 var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.sw{width:9px;height:9px;border-radius:2px;flex:none;background:var(--c)}
.row{display:flex;align-items:center;border-radius:4px}
.row:hover{background:#eef2ef}
.row.sel{background:var(--accent-soft)}
.row .name{flex:1;text-align:left;background:none;border:0;padding:5px 6px 5px 10px;cursor:pointer;font-size:14.5px;line-height:1.25}
.row.off .name{color:#97a19c;text-decoration:line-through}
.row.feat .name{font-style:italic}
.eye{background:none;border:0;padding:5px 8px;cursor:pointer;color:var(--muted);display:grid;place-items:center;border-radius:4px}
.eye:hover{color:var(--ink)}
.eye svg{width:18px;height:18px}
.eye-spacer{width:34px;flex:none}
.index-foot{padding:8px 16px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}

#view{grid-area:view;position:relative;overflow:hidden;min-height:0;background:radial-gradient(120% 95% at 35% 35%,#fbfcfb 0%,#eef1ee 55%,#dde3df 100%);transition:background .4s}
body.dark #view{background:radial-gradient(120% 95% at 35% 35%,#e3e6e4 0%,#cfd5d1 55%,#b9c1bc 100%)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
.plate-title{position:absolute;left:18px;top:14px;pointer-events:none;max-width:calc(100% - 36px)}
.plate-title h1{margin:0;font:700 30px/1 var(--display);letter-spacing:.01em;text-wrap:balance}
.plate-title h1 i{font-style:italic;font-weight:600}
.plate-title p{margin:5px 0 0;font:500 14px/1.3 var(--display);color:var(--muted);letter-spacing:.02em}
.plate-title p span+span::before{content:"|";margin:0 .45em;color:#aab4ae}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:14px}
.facts dt{font:600 12px/1.6 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
#labels,#leaders{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#labels[hidden],#leaders[hidden]{display:none}
#leaders{width:100%;height:100%}
#leaders .ln{fill:none;stroke:rgba(27,35,32,.62);stroke-width:1;stroke-dasharray:2 2}
#leaders .dt{fill:var(--ink)}
#leaders .sl{fill:none;stroke:var(--accent);stroke-width:1.5}
#leaders .sd{fill:var(--accent)}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;white-space:nowrap;font:600 13px/1.15 var(--display);letter-spacing:.015em;background:rgba(252,252,251,.92);border:1px solid var(--line);border-radius:3px;padding:2px 6px;cursor:pointer;will-change:transform;display:none}
.lbl:hover{border-color:var(--ink)}
.lbl.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.lbl.feat{font-style:italic;font-weight:500}
#scaleLbl{position:absolute;left:0;top:0;pointer-events:none;font:600 12.5px/1 var(--display);letter-spacing:.04em;color:var(--ink);will-change:transform;white-space:nowrap}
#scaleLbl[hidden]{display:none}
#legend{position:absolute;left:16px;bottom:14px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.3;pointer-events:none;max-width:min(360px,calc(100% - 32px))}
#legend .lg{background:rgba(252,252,251,.92);border:1px solid var(--line);border-radius:4px;padding:6px 9px;display:flex;flex-wrap:wrap;gap:3px 12px}
#legend .lg b{width:100%;font:600 11.5px/1.3 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#legend .it{display:flex;align-items:center;gap:5px}
#legend .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
#legend .sq{width:10px;height:10px;border-radius:2px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
#legend .cap{color:var(--muted);width:100%}
#legend .ctr{width:100%;font-variant-numeric:tabular-nums}
#legend .ctr b{display:inline;width:auto;font:600 13px/1.3 var(--body);letter-spacing:0;text-transform:none;color:var(--ink)}
#hint{position:absolute;right:14px;top:14px;font-size:12px;color:var(--muted);pointer-events:none;text-align:right}
#tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--ink);color:#fff;font:600 13px/1.2 var(--display);letter-spacing:.02em;padding:4px 7px;border-radius:3px;white-space:nowrap}
#tip[hidden]{display:none}
#toast{position:absolute;left:50%;top:76px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 12px;border-radius:4px;font-size:13.5px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#toast.on{opacity:1}
#status{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:15px;pointer-events:none;padding:24px;text-align:center}

#tools{grid-area:tools;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:9px 14px}
.tg{display:flex;align-items:center;gap:6px;flex:none}
.tg[hidden],.tb[hidden]{display:none}
.tl{font:600 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tb{border:1px solid var(--line);background:#fff;border-radius:4px;padding:5px 10px;cursor:pointer;font-size:14px;line-height:1.2;white-space:nowrap}
.tb:hover{border-color:#9aa49f}
.tb[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tb:disabled{opacity:.45;cursor:default}
select.tb{padding:5px 6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:14px;line-height:1.2;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{background:#eef2ef}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
input[type=range]{width:110px;accent-color:var(--accent)}
.count{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:3.2em}
.mobile-only{display:none}

#card{grid-area:card;background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-height:0}
.card-in{padding:18px 20px 22px;display:flex;flex-direction:column;gap:12px}
.eyebrow{margin:0;font:600 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card-in h2{margin:0;font:700 28px/1.05 var(--display);text-wrap:balance}
.card-in p{margin:0;max-width:62ch}
.card-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:4px 9px 4px 8px;background:#fff}
.x{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:4px}
.x:hover{color:var(--ink)}
.card-in h3{margin:0 0 3px;font:600 13px/1.2 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.key{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.note{background:#f0f3f1;border-radius:4px;padding:9px 12px;font-size:14px}
.ctx{font-size:13.5px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.tour{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.tour span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.primary{border:0;background:var(--accent);color:#fff;border-radius:4px;padding:9px 14px;font-weight:600;cursor:pointer;align-self:flex-start}
.primary:hover{filter:brightness(1.07)}
.golink{border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:4px;padding:7px 12px;font-weight:600;cursor:pointer;align-self:flex-start}
.golink:hover{background:var(--accent-soft)}
.stages{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.stages li{display:grid;grid-template-columns:12px 1fr;gap:2px 10px;font-size:14px;line-height:1.35}
.stages li::before{content:"";grid-row:span 2;width:12px;height:100%;min-height:34px;border-radius:2px;background:var(--c)}
.stages li.cur b::after{content:" · you are here";font:500 13px/1 var(--body);color:var(--muted)}
.stages button{all:unset;cursor:pointer}
.stages button:hover b{text-decoration:underline}
.stages b{font:600 16px/1.2 var(--display)}
.hint{font-size:13.5px;color:var(--muted)}
.refs{font-size:12.5px;color:var(--muted);line-height:1.45}
.refs summary{cursor:pointer;font:600 12px/1.6 var(--display);letter-spacing:.1em;text-transform:uppercase}
.refs ul{margin:6px 0 0;padding-left:16px}

@media (max-width:899px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;grid-template-areas:"view" "tools" "card"}
  #card{border-left:0;border-top:1px solid var(--line);max-height:38vh}
  #index{position:fixed;left:0;top:0;bottom:0;width:min(320px,86vw);transform:translateX(-102%);transition:transform .25s ease;box-shadow:0 0 30px rgba(0,0,0,.18);z-index:30}
  body.parts-open #index{transform:none}
  #tools{flex-wrap:nowrap;overflow-x:auto;gap:14px;padding:8px 12px;scrollbar-width:thin}
  .mobile-only{display:inline-block}
  .plate-title{left:14px;top:10px}
  .plate-title h1{font-size:23px}
  .plate-title p{font-size:12.5px}
  #hint{display:none}
  .card-in{padding:14px 16px 18px;gap:10px}
  .card-in h2{font-size:24px}
  #legend{left:10px;bottom:10px;font-size:12px}
  #legend .cap{display:none}
  #legend .lg{padding:4px 7px}
  #toast{top:64px}
}
@media (max-width:1350px){#hint{display:none}}
@media (prefers-reduced-motion:reduce){
  #index,#toast,#view{transition:none}
}
</style>

</script>

<body>
<div id="app">
  <aside id="index" aria-label="Parts">
    <div class="index-head"><h2 id="indexTitle">Parts</h2><button class="tb" id="bShowAll">Show all</button></div>
    <div id="partList"></div>
    <div class="index-foot" id="indexFoot"></div>
  </aside>

  <main id="view">
    <canvas id="scene" aria-label="Interactive 3D model of the diatom Phaeodactylum tricornutum. Drag to rotate, scroll or pinch to zoom."></canvas>
    <svg id="leaders" aria-hidden="true"><path class="ln" id="lnPath"/><path class="dt" id="dtPath"/><path class="sl" id="slPath"/><path class="sd" id="sdPath"/></svg>
    <div id="labels"></div>
    <div id="scaleLbl">5 µm</div>
    <header class="plate-title">
      <h1 id="plateH1"><i>Phaeodactylum tricornutum</i></h1>
      <p id="plateSub"></p>
    </header>
    <div id="legend"></div>
    <div id="hint">Drag to rotate · scroll to zoom · right-drag to pan</div>
    <div id="tip" hidden></div>
    <div id="toast" role="status"></div>
    <div id="status">Loading the 3D model…</div>
  </main>

  <div id="tools" aria-label="Controls">
    <button class="tb mobile-only" id="bParts">Parts</button>
    <div class="tg">
      <span class="tl">Scale</span>
      <div class="seg" role="group" aria-label="Scale" id="viewSeg"><button type="button" data-v="cell">Cell</button><button type="button" data-v="plastid">Chloroplast</button><button type="button" data-v="pyr">Pyrenoid</button></div>
    </div>
    <div class="tg">
      <button class="tb" id="tFlux">Carbon route</button>
      <button class="tb" id="tLight" data-views="plastid pyr">Light</button>
      <button class="tb" id="tPS" data-views="plastid">Photosystems</button>
      <button class="tb" id="tCut" data-views="cell">Cutaway</button>
      <button class="tb" id="tLbl">Labels</button>
    </div>
    <div class="tg">
      <label class="tl" for="explode">Explode</label>
      <input id="explode" type="range" min="0" max="100" value="0">
      <button class="tb" id="bExplode">Explode</button>
    </div>
    <div class="tg">
      <button class="tb" id="bBack">◂ Put back</button>
      <button class="tb" id="bNext">Take apart ▸</button>
      <span class="count" id="tdCount">0/0</span>
    </div>
    <div class="tg">
      <label class="tl" for="colorMode">Colour</label>
      <select class="tb" id="colorMode">
        <option value="illus">Illustrative</option>
        <option value="origin">Origin and encoding</option>
        <option value="tem">Electron density</option>
      </select>
      <button class="tb" id="bFit">Fit view</button>
    </div>
  </div>

  <section id="card" aria-live="polite"></section>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices, toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';

const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = t => t * t * (3 - 2 * t);
const sgnpow = (v, p) => Math.sign(v) * Math.abs(v) ** p;
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Seeded random numbers, so every visitor sees the same cell. */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry32(1055);
const rr = (a, b) => a + (b - a) * rnd();

/* ------------------------------------------------------------------ */
/* Renderer, scene, camera                                             */
/* ------------------------------------------------------------------ */
const viewEl = $('view'), canvas = $('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.7;
const hemi = new THREE.HemisphereLight(0xffffff, 0x9aa7a0, 0.95); scene.add(hemi);
const keyLight = new THREE.DirectionalLight(0xffffff, 2.0); keyLight.position.set(-4, 10, 8); scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xe2ecff, 0.75); fillLight.position.set(7, -4, -6); scene.add(fillLight);

const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 500);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.09;

/* ------------------------------------------------------------------ */
/* Geometry helpers                                                    */
/* ------------------------------------------------------------------ */
const UP = new THREE.Vector3(0, 1, 0);
function bare(g) {
  for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k);
  if (!g.attributes.normal) g.computeVertexNormals();
  return g;
}
function smoothify(g) {
  for (const k of Object.keys(g.attributes)) if (k !== 'position') g.deleteAttribute(k);
  const m = mergeVertices(g, 1e-4); m.computeVertexNormals(); return m;
}
function merge(list) {
  let nv = 0, ni = 0;
  for (const g of list) { nv += g.attributes.position.count; ni += g.index ? g.index.count : g.attributes.position.count; }
  const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3), idx = new Uint32Array(ni);
  let vo = 0, io = 0;
  for (const g of list) {
    if (!g.attributes.normal) g.computeVertexNormals();
    const c = g.attributes.position.count;
    pos.set(g.attributes.position.array, vo * 3); nor.set(g.attributes.normal.array, vo * 3);
    if (g.index) { const a = g.index.array; for (let k = 0; k < a.length; k++) idx[io + k] = a[k] + vo; io += a.length; }

    vo += c;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.computeBoundingSphere(); g.computeBoundingBox();
  return g;
}
/* A grid surface: fn(u, v) -> [x, y, z]; v wraps round when closeV. */
function gridGeo(nu, nv, fn, closeV = true, skip = null) {
  const cols = closeV ? nv : nv + 1, pos = [], idx = [];
  for (let i = 0; i <= nu; i++) for (let j = 0; j < cols; j++) { const p = fn(i / nu, j / nv); pos.push(p[0], p[1], p[2]); }
  for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
    if (skip && skip((i + 0.5) / nu, (j + 0.5) / nv)) continue;
    const j1 = closeV ? (j + 1) % nv : j + 1;
    const a = i * cols + j, b = (i + 1) * cols + j, c = (i + 1) * cols + j1, d = i * cols + j1;

  g.setIndex(idx); g.computeVertexNormals();

/* Make front faces point outwards (needed for the lumen tint on back faces). */
function orientOut(g) {
  g.computeBoundingBox(); if (!g.attributes.normal) g.computeVertexNormals();
  const c = g.boundingBox.getCenter(new THREE.Vector3()), p = g.attributes.position, n = g.attributes.normal;
  let s = 0;
  for (let i = 0; i < p.count; i++) s += (p.getX(i) - c.x) * n.getX(i) + (p.getY(i) - c.y) * n.getY(i) + (p.getZ(i) - c.z) * n.getZ(i);
  if (s < 0) {
    const ix = g.index.array;
    for (let k = 0; k < ix.length; k += 3) { const t = ix[k + 1]; ix[k + 1] = ix[k + 2]; ix[k + 2] = t; }

/* Loft a closed polygon of [z, y] points along x. Sections share point counts. Outward normals, creased. */
function loft(sections, { capStart = false, capEnd = false, crease = 0.75 } = {}) {
  const p0 = sections[0].pts, n = p0.length;
  let area = 0; for (let j = 0; j < n; j++) { const [a1, b1] = p0[j], [a2, b2] = p0[(j + 1) % n]; area += a1 * b2 - a2 * b1; }
  const rev = area < 0, pos = [], idx = [];
  const ordered = s => rev ? s.pts.slice().reverse() : s.pts;
  for (const s of sections) for (const [z, y] of ordered(s)) pos.push(s.x, y, z);
  for (let i = 0; i < sections.length - 1; i++) for (let j = 0; j < n; j++) {

    idx.push(a, b, d, b, c, d);
  }

    const s = sections[si], pts = ordered(s), base = pos.length / 3;
    const tri = THREE.ShapeUtils.triangulateShape(pts.map(([z, y]) => new THREE.Vector2(z, y)), []);

/* Molecular view: HCO3- diffuses along the PPT lumen; θ-CA makes CO2, which diffuses into the matrix and meets Rubisco. */

    legend: () => `<span class="ctr">CO₂ made <b id="ctrA">${recent(made, clock, 8).toFixed(1)}</b> · fixed in view <b id="ctrB">${recent(fixed, clock, 8).toFixed(1)}</b> per second (model)</span>`,
    counters: () => { const a = $('ctrA'), b = $('ctrB'); if (a) a.textContent = recent(made, clock, 8).toFixed(1); if (b) b.textContent = recent(fixed, clock, 8).toFixed(1); },
  };
}

resize();

let last = performance.now(), ctrT = 0, frozen = false;

  }

  for (const c of v.flux.clouds) c.pts.visible = showFlux;

    ctrT += dt; if (ctrT > 0.4) { ctrT = 0; if (v.flux.counters) v.flux.counters(); }

    const k = smooth(clamp((now - camTween.t0) / camTween.dur, 0, 1));

  for (const c of v.flux.clouds) c.pts.visible = showFlux;
  if (showFlux) for (let i = 0; i < fluxSteps; i++) v.flux.step(0.05);

}
window.__pt = { VIEWS, state, switchView, select, setToggle, setRemoved, fitView, renderOnce, info: () => renderer.info.render, freeze: f => { frozen = f; last = performance.now(); }, explode: e => { V().E = e; syncExplode(); dirty = true; }, camera, controls };
</script>
